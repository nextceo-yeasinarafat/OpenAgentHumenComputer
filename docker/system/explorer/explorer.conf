#!/usr/bin/env bash
# Settings of the file explorer of the computer.
#
# The explorer of the desktop is PCManFM, the stable GTK file manager of the
# Ubuntu 24.04 archive. It is a real Linux file manager on the real X display
# of the computer: it browses the same /home/open-computer that the terminal
# and the bridge use.
#
#   explorer.conf  <- this file: the binary, the display and the files
#   install.sh     <- put the explorer in the image (apt)
#   run.sh         <- one explorer window, in the foreground
#   control.sh     <- open, close, status, logs
: "${OPEN_COMPUTER_USER:=open-computer}"
: "${OPEN_COMPUTER_USER_HOME:=/home/${OPEN_COMPUTER_USER}}"
: "${DISPLAY:=:1}"

: "${OPEN_COMPUTER_EXPLORER_BIN:=pcmanfm}"
: "${OPEN_COMPUTER_EXPLORER_HOME:=/opt/open-computer/explorer}"
: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"

EXPLORER_LOG="$OPEN_COMPUTER_LOG_DIR/explorer.log"
EXPLORER_PID_FILE="$OPEN_COMPUTER_LOG_DIR/explorer.pid"
