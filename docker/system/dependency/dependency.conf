#!/usr/bin/env bash
# Shared settings of the dependency installers.
#
# Each script resolves the latest stable release at build time and writes the
# installed version next to itself. The fallbacks below are only used when the
# upstream version API cannot be reached; they are the latest stable releases
# when this file was written (2026-10-24).
#
#   dependency.conf   <- this file: prefixes and fallback versions
#   curl_install.sh   <- latest stable curl, built from source
#   python_install.sh <- latest stable Python, built from source
#   dependency.md     <- documentation

# -- where the tools live ----------------------------------------------------
: "${CURL_PREFIX:=/opt/curl}"
: "${PYTHON_PREFIX:=/opt/python}"

: "${OPEN_COMPUTER_DEPENDENCY_HOME:=/opt/open-computer/dependency}"
: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"

# -- fallbacks (latest stable when written) ----------------------------------
: "${CURL_VERSION_FALLBACK:=8.23.0}"
: "${PYTHON_VERSION_FALLBACK:=3.16.0}"
