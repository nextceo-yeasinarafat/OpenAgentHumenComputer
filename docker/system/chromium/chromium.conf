#!/usr/bin/env bash
# Settings of the browser of the computer.
#
# The browser is Google Chrome stable, installed from Google's apt repository
# into the Ubuntu image. It runs on the real X display of the computer, with
# its DevTools protocol on loopback and its profile in the mounted home.
#
#   chromium.conf   <- this file: the browser, its profile and its ports
#   install.sh      <- put the browser in the image (Google's apt repository)
#   run.sh          <- the browser itself, in the foreground
#   control.sh      <- start, stop, status, logs, supervise, forward
#   open.sh         <- open a link in the running browser
#   cdp-forward.py  <- the DevTools protocol out to the bridge
: "${OPEN_COMPUTER_USER:=open-computer}"
: "${OPEN_COMPUTER_USER_HOME:=/home/open-computer}"
: "${DISPLAY:=:1}"

# Google Chrome stable is the browser of the computer: the chromium package of
# the distribution is a snap wrapper and snapd does not run in an unprivileged
# container.
: "${OPEN_COMPUTER_CHROMIUM_BIN:=google-chrome-stable}"
: "${OPEN_COMPUTER_CHROMIUM_HOME:=/opt/open-computer/chromium}"
: "${OPEN_COMPUTER_CHROMIUM_PROFILE:=$OPEN_COMPUTER_USER_HOME/.config/open-computer-browser}"

# The DevTools protocol. The browser listens on loopback only; cdp-forward.py
# lets the bridge outside the computer reach it.
: "${OPEN_COMPUTER_CDP_PORT:=9222}"
: "${OPEN_COMPUTER_CDP_FORWARD_PORT:=9223}"

# The page of a browser that is started without one.
: "${OPEN_COMPUTER_CHROMIUM_URL:=https://www.google.com}"

# The screen of this image is 1920x1080 (novnc/novnc.conf). The browser opens
# as a Full HD page at scale 1, so it fills that screen.
: "${OPEN_COMPUTER_CHROMIUM_WINDOW_SIZE:=1920,1080}"
: "${OPEN_COMPUTER_CHROMIUM_WINDOW_POSITION:=0,0}"
: "${OPEN_COMPUTER_CHROMIUM_SCALE:=2}"

: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"
CHROMIUM_LOG="$OPEN_COMPUTER_LOG_DIR/chromium.log"
CHROMIUM_PID_FILE="$OPEN_COMPUTER_LOG_DIR/chromium.pid"
CDP_FORWARD_LOG="$OPEN_COMPUTER_LOG_DIR/cdp-forward.log"
CDP_FORWARD_PID_FILE="$OPEN_COMPUTER_LOG_DIR/cdp-forward.pid"

# The mark of a browser that was put to sleep on purpose. While it is there a
# supervisor does not start the browser again.
ASLEEP_MARK=/tmp/open-computer-browser-asleep

# The sessions of the browser: a browser started with them comes back with the
# tabs it left, still pinned.
CHROMIUM_SESSIONS="$OPEN_COMPUTER_CHROMIUM_PROFILE/Default/Sessions"

# Switches: 0 turns the part off.
: "${OPEN_COMPUTER_START_BROWSER:=1}"
: "${OPEN_COMPUTER_START_CDP_FORWARD:=1}"
: "${OPEN_COMPUTER_CHROMIUM_RESTART_DELAY:=2}"
