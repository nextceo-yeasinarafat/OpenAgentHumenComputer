#!/usr/bin/env bash
# Settings of the auth of the computer.
#
# The account is dynamic — the computer is made with whichever account its
# maker chose — so the values that name the account arrive from the
# environment (computer_setup.sh sets them at first boot; the bridge knows
# them too).

: "${OPEN_COMPUTER_AUTH_HOME:=/opt/open-computer/auth}"

# The door speaks on the loopback of the computer only: the bridge is the one
# that may carry words to it.
: "${AUTH_PORT:=8988}"

# The account the door belongs to. computer_setup.sh exports the real one.
: "${AUTH_USER:=open-computer}"
: "${AUTH_HOME:=/home/${AUTH_USER}}"

: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"
AUTH_LOG="$OPEN_COMPUTER_LOG_DIR/auth.log"
AUTH_PID_FILE="$OPEN_COMPUTER_LOG_DIR/auth.pid"

# The signatures live for a day.
: "${AUTH_EXPIRE_HOURS:=24}"
