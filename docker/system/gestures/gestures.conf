#!/usr/bin/env bash
# Settings of the gestures of the browser.
#
# One word today: the sideways swipe that walks the history is taken away,
# because on a screen that is the computer a page must never move unless the
# person asked it to. The browser reads this through its own settings file,
# as OPEN_COMPUTER_CHROMIUM_EXTRA_ARGS (see control.sh).

: "${GESTURES_CHROMIUM_EXTRA_ARGS:=--overscroll-history-navigation=0}"
