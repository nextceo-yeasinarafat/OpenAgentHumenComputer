#!/usr/bin/env bash
# Settings of the editor of the computer.
#
# The editor is the latest stable Visual Studio Code Server (the web build) on
# port 8989, under the /vscode base path. It runs inside the Ubuntu image, on
# the same home as the terminal and the explorer.
#
#   vscode.conf   <- this file: the port, the base path and the data
#   install.sh    <- download the latest stable server into the image
#   run.sh        <- serve one server in the foreground
#   control.sh    <- start, stop, status, logs
: "${OPEN_COMPUTER_USER:=open-computer}"
: "${OPEN_COMPUTER_USER_HOME:=/home/open-computer}"

: "${OPEN_COMPUTER_VSCODE_PORT:=8989}"
: "${OPEN_COMPUTER_VSCODE_BASE_PATH:=/vscode}"
: "${OPEN_COMPUTER_VSCODE_HOST:=0.0.0.0}"

: "${VSCODE_SERVER_DIR:=/opt/vscode-server}"
: "${VSCODE_SERVER_DATA:=$OPEN_COMPUTER_USER_HOME/.vscode-server}"
: "${OPEN_COMPUTER_VSCODE_HOME:=/opt/open-computer/vscode}"

: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"
VSCODE_LOG="$OPEN_COMPUTER_LOG_DIR/vscode.log"
VSCODE_PID_FILE="$OPEN_COMPUTER_LOG_DIR/vscode.pid"
