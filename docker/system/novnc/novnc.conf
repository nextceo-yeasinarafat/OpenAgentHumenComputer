#!/usr/bin/env bash
# Settings of the remote screen of the computer.
#
# Every script of this folder reads this file first, so the screen, the ports
# and the version of noVNC are configured in one place. The image keeps the
# folder at /opt/open-computer/novnc, and a variable that is already set in the
# environment wins over the default here.
#
#   novnc.conf   <- this file: display, ports and versions
#   install.sh   <- put noVNC, x11vnc and the display in the image
#   run.sh       <- start the display, the VNC server and noVNC
#   control.sh   <- start, stop, status, logs

# -- the machine -------------------------------------------------------------
: "${OPEN_COMPUTER_USER:=open-computer}"
: "${OPEN_COMPUTER_USER_HOME:=/home/open-computer}"
: "${DISPLAY:=:1}"
: "${OPEN_COMPUTER_SCREEN:=3840x2160x24}"

# -- the versions ------------------------------------------------------------
# The latest stable releases when this module was written. Override them from
# the environment to pin another build.
: "${NOVNC_VERSION:=1.7.0}"
: "${WEBSOCKIFY_VERSION:=0.13.0}"

# -- the ports ---------------------------------------------------------------
# noVNC is the only port meant to leave the computer. Raw VNC stays on
# loopback, because this image has no VNC password.
: "${OPEN_COMPUTER_NOVNC_PORT:=6080}"
: "${OPEN_COMPUTER_VNC_PORT:=5900}"
: "${OPEN_COMPUTER_BIND:=0.0.0.0}"

# -- the files ---------------------------------------------------------------
: "${OPEN_COMPUTER_NOVNC_HOME:=/opt/open-computer/novnc}"
: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"

NOVNC_APP="$OPEN_COMPUTER_NOVNC_HOME/app"
NOVNC_VENV="$OPEN_COMPUTER_NOVNC_HOME/venv"
WEBSOCKIFY="$NOVNC_VENV/bin/websockify"

NOVNC_LOG="$OPEN_COMPUTER_LOG_DIR/novnc.log"
XVFB_LOG="$OPEN_COMPUTER_LOG_DIR/xvfb.log"
X11VNC_LOG="$OPEN_COMPUTER_LOG_DIR/x11vnc.log"
FLUXBOX_LOG="$OPEN_COMPUTER_LOG_DIR/fluxbox.log"

XVFB_PID_FILE="$OPEN_COMPUTER_LOG_DIR/xvfb.pid"
X11VNC_PID_FILE="$OPEN_COMPUTER_LOG_DIR/x11vnc.pid"
FLUXBOX_PID_FILE="$OPEN_COMPUTER_LOG_DIR/fluxbox.pid"
WEBSOCKIFY_PID_FILE="$OPEN_COMPUTER_LOG_DIR/websockify.pid"
