#!/usr/bin/env bash
# Settings of the DevTools protocol bridge of the computer.
#
# CDP (Chrome DevTools Protocol) is a protocol, not a package with a version:
# the protocol version is the one the installed Chrome speaks, and control.sh
# version reads it from the browser (`Protocol-Version` in /json/version).
#
# Chrome only listens for the DevTools protocol on 127.0.0.1:9222. The bridge
# listens on the container network on 9223 and forwards the traffic, so the
# host bridge can reach it without exposing the browser port.
#
#   cdp.conf        <- this file: the ports, the bind address and the files
#   cdp-forward.py  <- the forwarder itself
#   install.sh      <- put the controller on the PATH of the computer
#   run.sh          <- one forwarder in the foreground
#   control.sh      <- start, stop, status, logs, version
: "${OPEN_COMPUTER_CDP_HOME:=/opt/open-computer/cdp}"

# 9222 is Chrome on loopback; 9223 is this bridge on the container network.
: "${OPEN_COMPUTER_CDP_BROWSER_PORT:=9222}"
: "${OPEN_COMPUTER_CDP_FORWARD_PORT:=9223}"

: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"
CDP_LOG="$OPEN_COMPUTER_LOG_DIR/cdp.log"
CDP_PID_FILE="$OPEN_COMPUTER_LOG_DIR/cdp.pid"

# The version of this forwarder. The CDP protocol version is read from the
# browser at runtime (control.sh version).
CDP_FORWARD_VERSION="1.0.0"
