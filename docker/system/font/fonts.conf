<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The typeface of the computer.
     Anthropic Serif Text is the face of the system: the desktop and the pages
     of the browser are written in it. Noto Serif Bengali stays as the
     fallback, so Bengali text is written in a real Bengali face instead of
     empty boxes. -->
<fontconfig>
  <!-- the generic families -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>

  <!-- the families a web page asks for by name -->
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Georgia</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Trebuchet MS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>

  <!-- the families fontconfig substitutes for them, so the substitution does
       not bring another face back -->
  <match target="pattern">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anthropic Serif Text</string></edit>
  </match>
</fontconfig>
