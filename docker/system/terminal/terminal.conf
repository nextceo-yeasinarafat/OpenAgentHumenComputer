#!/usr/bin/env bash
# Settings of the terminal of the computer.
#
# The terminal of the computer is xterm on the real X display of the Linux
# computer. It is the window the user types a bash shell into, and it runs
# inside the Ubuntu image, not in the browser.
#
#   terminal.conf  <- this file: the binary, the display and the files
#   install.sh     <- put the terminal in the image (apt)
#   run.sh         <- one terminal window, in the foreground
#   control.sh     <- open, close, status, logs
: "${OPEN_COMPUTER_USER:=open-computer}"
: "${OPEN_COMPUTER_USER_HOME:=/home/${OPEN_COMPUTER_USER}}"
: "${DISPLAY:=:1}"

: "${OPEN_COMPUTER_TERMINAL_BIN:=xterm}"
: "${OPEN_COMPUTER_TERMINAL_HOME:=/opt/open-computer/terminal}"
: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"

TERMINAL_LOG="$OPEN_COMPUTER_LOG_DIR/terminal.log"
TERMINAL_PID_FILE="$OPEN_COMPUTER_LOG_DIR/terminal.pid"
