#!/usr/bin/env bash
# Settings of the core system: the services that were started by hand until
# this folder was born, and the place the project lives.

: "${AGENT_HUMEN_COMPUTER_HOME:=/home/ceomax/code/open-computer/sandbox/computer/openagenthumencomputer}"

# The bridge of the computer (the host side). It listens here.
: "${AGENT_HUMEN_COMPUTER_BRIDGE_PORT:=7071}"

# The container of the made computer.
: "${AGENT_HUMEN_COMPUTER_CONTAINER:=openhumen-computer}"

: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"
BRIDGE_LOG="$OPEN_COMPUTER_LOG_DIR/bridge.log"
