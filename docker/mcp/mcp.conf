#!/usr/bin/env bash
# Settings of the MCP of the computer.
#
# The MCP SDK is installed into the Python of the computer by this package's
# install.sh; this package owns the server of the computer itself: the port it
# speaks on, the transport, and the version fallback.

: "${OPEN_COMPUTER_MCP_HOME:=/opt/open-computer/mcp}"

# The server of the computer speaks HTTP, so an AI client of the network can
# reach it without a shell of this machine.
: "${OPEN_COMPUTER_MCP_TRANSPORT:=streamable-http}"
: "${OPEN_COMPUTER_MCP_HOST:=0.0.0.0}"
: "${OPEN_COMPUTER_MCP_PORT:=7072}"

: "${OPEN_COMPUTER_LOG_DIR:=/tmp/open-computer}"
MCP_LOG="$OPEN_COMPUTER_LOG_DIR/mcp.log"
MCP_PID_FILE="$OPEN_COMPUTER_LOG_DIR/mcp.pid"

# The fallback when PyPI cannot be reached at build time.
: "${MCP_VERSION_FALLBACK:=2.3.0}"
